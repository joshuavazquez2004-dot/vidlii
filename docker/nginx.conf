worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 512m;
    fastcgi_read_timeout 300s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    server {
        listen 8080;
        server_name _;
        root /app;
        index index.php;

        # Uploaded avatars and video thumbnails: fall back to the placeholder
        # shipped with the app when the file is missing, and for empty names
        # such as "/vi/ava/.jpg". "^~" keeps these ahead of the dotfile deny
        # rule below so a placeholder is served instead of a 403.
        location ^~ /vi/ava/ {
            try_files $uri /vi/ava/default.jpg;
            access_log off;
        }
        location ^~ /vi/ {
            try_files $uri /vi/default.jpg;
            access_log off;
        }

        # Application internals and credentials must never be downloadable.
        location ~ /\.(?!well-known) { deny all; }
        location ^~ /vendor/ { deny all; }
        location ^~ /_includes/ { deny all; }
        location ^~ /docker/ { deny all; }
        location = /schema.sql { deny all; }
        location ~* ^/(composer\.(json|lock)|Dockerfile|\.dockerignore)$ { deny all; }

        # Media, themes and scripts are served straight from disk (matches .htaccess).
        location ~ ^/(css|js|img|usfi|vlPlayer|jwplayer2)/ {
            try_files $uri =404;
            access_log off;
        }

        location ~ \.php$ {
            try_files $uri =404;
            # Absolute path: the running config may be rendered into /tmp.
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_pass 127.0.0.1:9000;
        }

        # Everything else is handled by the front controller, as .htaccess does.
        location / {
            rewrite ^ /index.php last;
        }
    }
}
